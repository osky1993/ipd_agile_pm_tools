server:
  port: 8080

spring:
  application:
    name: ipd-agile-toolbox
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ipd_toolbox?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:ipd}
    password: ${DB_PASSWORD:ipd123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 证据文件存储根目录
ipd:
  evidence:
    root: ${EVIDENCE_ROOT:./data/evidence}
  jwt:
    secret: ${JWT_SECRET:ipd-toolbox-dev-secret-key-change-me-in-prod-0123456789}
    expire-minutes: 720

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ipd.toolbox: DEBUG
